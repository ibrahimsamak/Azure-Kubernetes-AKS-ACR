environment: local

image:
  registry: ""
  repository: ""
  tag: "local"
  pullPolicy: IfNotPresent

containerPort: 8080
extraPorts: []

env: {}
secretEnvFrom: []

workloadIdentity:
  enabled: false
  clientId: ""

replicaCount: 1
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

probes:
  startup:
    path: /health/live
    periodSeconds: 5
    failureThreshold: 30
  liveness:
    path: /health/live
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /health/ready
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

terminationGracePeriodSeconds: 30

ingress:
  enabled: false
  className: ""
  path: /api
