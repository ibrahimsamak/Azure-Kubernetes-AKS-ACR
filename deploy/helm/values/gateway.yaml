image:
  repository: orderflow/gateway
env:
  ReverseProxy__Clusters__order__Destinations__primary__Address: "http://order:8080"
probes:
  readiness:
    path: /health/ready
ingress:
  enabled: true
secretEnvFrom: []
# Only the ingress controller (the App Routing add-on runs in app-routing-system).
networkPolicy:
  allowFrom:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app-routing-system
      ports: [8080]
