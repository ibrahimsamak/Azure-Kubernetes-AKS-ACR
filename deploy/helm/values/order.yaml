image:
  repository: orderflow/order-api
env:
  Inventory__GrpcAddress: "http://inventory:8081"
resources:
  requests: { cpu: 150m, memory: 300Mi }
  limits: { memory: 600Mi }
# Only the gateway.
networkPolicy:
  allowFrom:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports: [8080]
