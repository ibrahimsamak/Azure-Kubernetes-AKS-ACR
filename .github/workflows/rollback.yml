name: rollback

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to redeploy (its images must already be in ACR)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-refs/heads/main
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      TAG: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1          # v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Azure login (deploy identity)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6               # v2.3.1
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4          # v4.3.1
        with:
          version: v4.3.0

      - name: kubeconfig (Entra ID via kubelogin — no certificates)
        run: |
          source infra/env.sh
          mkdir -p "$HOME/bin"
          az aks install-cli --install-location "$HOME/bin/kubectl" --kubelogin-install-location "$HOME/bin/kubelogin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/bin:$PATH"
          az aks get-credentials -g "$RG" -n "$AKS" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: The images exist
        run: |
          [[ "$TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40-char commit SHA"; exit 1; }
          source infra/env.sh
          for image in order-api inventory-api payment-api notification-api gateway; do
            az acr repository show -n "$ACR" --image "orderflow/$image:$TAG" -o none
            echo "found orderflow/$image:$TAG"
          done

      - name: Redeploy
        run: |
          source infra/env.sh
          bash deploy/scripts/write-azure-values.sh
          bash deploy/scripts/helm-deploy.sh azure
