name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write           # handed down to ci.yml
  id-token: write         # lets jobs request a GitHub OIDC token for azure/login

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false   # never kill a deploy half-way; queue the next run instead

env:
  TAG: ${{ github.sha }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # ------------------------------------------------------------------ build once
  images:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: order-api,        dockerfile: src/Services/Order/OrderFlow.Order.Api/Dockerfile }
          - { image: inventory-api,    dockerfile: src/Services/Inventory/OrderFlow.Inventory.Api/Dockerfile }
          - { image: payment-api,      dockerfile: src/Services/Payment/OrderFlow.Payment.Api/Dockerfile }
          - { image: notification-api, dockerfile: src/Services/Notification/OrderFlow.Notification.Api/Dockerfile }
          - { image: gateway,          dockerfile: src/Gateway/OrderFlow.Gateway/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: orderflow/${{ matrix.image }}:${{ env.TAG }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25    # v0.36.0 (tags are v-prefixed)
        with:
          image-ref: orderflow/${{ matrix.image }}:${{ env.TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          trivyignores: .trivyignore

      # SBOM: the list of every package in the image. When the next Log4Shell lands, "are we
      # affected?" becomes a search over these files instead of an archaeology project.
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: orderflow/${{ matrix.image }}:${{ env.TAG }}
          format: cyclonedx
          output: sbom-${{ matrix.image }}.cdx.json
          exit-code: '0'
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cdx.json
          retention-days: 90

      - name: Azure login (build identity)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_BUILD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Push to ACR
        run: |
          source infra/env.sh
          az acr login --name "$ACR"
          remote="$ACR.azurecr.io/orderflow/${{ matrix.image }}:$TAG"
          docker tag "orderflow/${{ matrix.image }}:$TAG" "$remote"
          docker push "$remote"

  # ------------------------------------------------------------------ staging (ephemeral)
  e2e:
    name: e2e (staging)
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging        # subject …:environment:staging -> trusted by the BUILD identity
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile apps
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (build identity — pull only)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_BUILD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Registry
        run: |
          source infra/env.sh
          az acr login --name "$ACR"
          echo "REGISTRY=$ACR.azurecr.io" >> "$GITHUB_ENV"

      - name: Start the stack from the images under test
        run: |
          $COMPOSE pull inventory payment notification order gateway
          $COMPOSE up -d --no-build

      - name: Smoke test — happy path, compensation, idempotency
        run: bash deploy/scripts/smoke-test.sh full http://localhost:8080

      - name: Collect logs
        if: failure()
        run: $COMPOSE logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 7

      - name: Tear down
        if: always()
        run: $COMPOSE down -v

  # ------------------------------------------------------------------ production (gated)
  deploy:
    needs: [images, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production          # required reviewer + main only; subject …:environment:production
      url: ${{ steps.smoke.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (deploy identity)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0       # match `helm version` on your machine

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/orderflow-web/package-lock.json

      - name: kubeconfig
        run: |
          source infra/env.sh
          az aks get-credentials -g "$RG" -n "$AKS" --overwrite-existing

      - name: Snapshot current revisions (the rollback target)
        run: bash deploy/scripts/helm-snapshot.sh | tee rollback-revisions.txt

      - name: Deploy services (Helm ×5)
        run: |
          source infra/env.sh
          bash deploy/scripts/write-azure-values.sh
          bash deploy/scripts/helm-deploy.sh azure

      - name: Apply APIM policy
        run: bash deploy/scripts/apim-apply-policy.sh

      - name: Deploy SPA
        run: bash deploy/scripts/deploy-web.sh

      - name: Smoke test (edge)
        id: smoke
        run: |
          ip=$(kubectl get ingress gateway -n orderflow -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "url=http://$ip" >> "$GITHUB_OUTPUT"
          bash deploy/scripts/smoke-test.sh edge "http://$ip"

      - name: Roll back ALL releases
        if: failure()
        run: bash deploy/scripts/helm-rollback.sh rollback-revisions.txt
