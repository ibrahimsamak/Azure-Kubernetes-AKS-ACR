name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  id-token: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.sha }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: order-api,        dockerfile: src/Services/Order/OrderFlow.Order.Api/Dockerfile }
          - { image: inventory-api,    dockerfile: src/Services/Inventory/OrderFlow.Inventory.Api/Dockerfile }
          - { image: payment-api,      dockerfile: src/Services/Payment/OrderFlow.Payment.Api/Dockerfile }
          - { image: notification-api, dockerfile: src/Services/Notification/OrderFlow.Notification.Api/Dockerfile }
          - { image: gateway,          dockerfile: src/Gateway/OrderFlow.Gateway/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: orderflow/${{ matrix.image }}:${{ env.TAG }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25    # v0.36.0
        with:
          image-ref: orderflow/${{ matrix.image }}:${{ env.TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          trivyignores: .trivyignore

      - name: Azure login (OIDC — no secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_BUILD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Push to ACR
        run: |
          source infra/env.sh
          az acr login --name "$ACR"
          remote="$ACR.azurecr.io/orderflow/${{ matrix.image }}:$TAG"
          docker tag "orderflow/${{ matrix.image }}:$TAG" "$remote"
          docker push "$remote"

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (deploy identity)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      - name: kubeconfig
        run: |
          source infra/env.sh
          az aks get-credentials -g "$RG" -n "$AKS" --overwrite-existing

      - name: Deploy (Helm ×5)
        run: |
          source infra/env.sh
          bash deploy/scripts/write-azure-values.sh
          bash deploy/scripts/helm-deploy.sh azure
