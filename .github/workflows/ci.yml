name: ci

on:
  pull_request:
    branches: [main]
  workflow_call:          # cd.yml reuses this, so a push to main runs the checks exactly once

permissions:
  contents: read
  checks: write           # dorny/test-reporter publishes the results as a check run

jobs:
  dotnet:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262          # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9      # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830             # v4.3.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore OrderFlow.slnx

      # TreatWarningsAsErrors is on in Directory.Build.props: an analyzer warning or a package
      # with a known vulnerability (NU1903) fails here, before any test runs.
      - name: Build
        run: dotnet build OrderFlow.slnx --configuration Release --no-restore

      - name: Unit + contract tests
        run: >
          dotnet test OrderFlow.slnx --configuration Release --no-build
          --filter "FullyQualifiedName!~OrderFlow.IntegrationTests"
          --logger "trx;LogFilePrefix=unit"
          --results-directory TestResults
          --collect "XPlat Code Coverage"

      # ubuntu-latest has a Docker daemon, so Testcontainers starts SQL Server and Kafka exactly
      # as on your machine. DockerFact would skip these if Docker were missing — here it never is.
      - name: Integration tests (Testcontainers)
        run: >
          dotnet test tests/OrderFlow.IntegrationTests/OrderFlow.IntegrationTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFilePrefix=integration"
          --results-directory TestResults

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451       # v2.7.0
        with:
          name: .NET tests
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false        # the test steps already failed the job; this is for reading

      - name: Upload test results + coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: test-results
          path: TestResults
          retention-days: 7

  web:
    name: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/orderflow-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262          # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020        # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/orderflow-web/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production

  security:
    name: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262          # v4.4.0
        with:
          fetch-depth: 0            # gitleaks scans the whole history, not just the tip

      # A secret committed and then deleted is still in git history — and still leaked.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7    # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Misconfiguration in Dockerfiles, the Helm chart and k8s manifests: root users, privilege
      # escalation, missing limits, host mounts...
      - name: Config scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25    # v0.36.0 (tags are v-prefixed)
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore
