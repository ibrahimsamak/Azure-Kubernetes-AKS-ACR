# A CVE fixed upstream is only fixed for us when we take the update. Dependabot opens the PR;
# ci.yml says whether it's safe to merge. Grouped, so it's one PR per family — and they get merged.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      opentelemetry: { patterns: ["OpenTelemetry*", "Azure.Monitor.OpenTelemetry*"] }
      azure:         { patterns: ["Azure.*", "Microsoft.Azure.*", "Microsoft.Identity.*"] }
      microsoft:     { patterns: ["Microsoft.*", "System.*"] }
      testing:       { patterns: ["xunit*", "Testcontainers*", "PactNet*", "Microsoft.NET.Test.Sdk", "coverlet*"] }

  # Actions are pinned by SHA with a "# vX.Y.Z" comment; Dependabot bumps both together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }

  - package-ecosystem: docker
    directories:
      - "/src/Services/Order/OrderFlow.Order.Api"
      - "/src/Services/Inventory/OrderFlow.Inventory.Api"
      - "/src/Services/Payment/OrderFlow.Payment.Api"
      - "/src/Services/Notification/OrderFlow.Notification.Api"
      - "/src/Gateway/OrderFlow.Gateway"
    schedule: { interval: weekly }

  - package-ecosystem: npm
    directory: "/web/orderflow-web"
    schedule: { interval: weekly }
    groups:
      angular: { patterns: ["@angular/*", "@angular-devkit/*"] }
      msal:    { patterns: ["@azure/msal-*"] }
